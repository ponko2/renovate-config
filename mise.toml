[env]
_.path = ["node_modules/.bin"]

[settings]
lockfile = true

[tools]
"npm:@commitlint/cli" = "latest"
actionlint = "latest"
editorconfig-checker = "latest"
ghalint = "latest"
hk = "latest"
oxfmt = "latest"
pnpm = "latest"
python = "latest"
uv = "latest"
zizmor = "latest"

[tools.yamllint]
version = "latest"
depends = ["python", "uv"]
